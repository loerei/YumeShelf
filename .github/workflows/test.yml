name: Test Suite (Cross-Platform)

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
      - chore/*
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Engine Build & Tests
        run: |
          pnpm --filter @yumeshelf/engine build
          pnpm --filter @yumeshelf/engine test

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run TypeScript & Unit Tests
        run: pnpm test

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Toolchain & Target Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native/playtime-helper -> native/playtime-helper/target"

      - name: Rust Playtime Helper Cargo Test
        run: cargo test --manifest-path native/playtime-helper/Cargo.toml
