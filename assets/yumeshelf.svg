<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b36" />
      <stop offset="100%" stop-color="#101115" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  
  <path d="M 110 400 L 402 400" stroke="#4a4b56" stroke-width="12" stroke-linecap="round"/>

  <g transform="translate(0, -2)">
    <rect x="144" y="232" width="56" height="170" rx="8" fill="#1c1d24" stroke="#e2e2e2" stroke-width="12" stroke-linejoin="round"/>
    <line x1="156" y1="264" x2="188" y2="264" stroke="#e2e2e2" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(0, -2)">
    <rect x="216" y="184" width="64" height="218" rx="8" fill="#1c1d24" stroke="url(#accentGradient)" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="248" cy="232" r="8" fill="url(#accentGradient)"/>
    <circle cx="248" cy="264" r="8" fill="url(#accentGradient)"/>
  </g>

  <g transform="translate(364, 398) rotate(18) translate(-364, -398)">
    <rect x="308" y="242" width="56" height="156" rx="8" fill="#1c1d24" stroke="#e2e2e2" stroke-width="12" stroke-linejoin="round"/>
    <line x1="336" y1="274" x2="336" y2="306" stroke="#e2e2e2" stroke-width="6" stroke-linecap="round"/>
  </g>

  <path d="M 248 60 Q 248 116 304 116 Q 248 116 248 172 Q 248 116 192 116 Q 248 116 248 60 Z" fill="url(#goldGradient)" filter="url(#glow)"/>
  <path d="M 344 130 Q 344 150 364 150 Q 344 150 344 170 Q 344 150 324 150 Q 344 150 344 130 Z" fill="url(#goldGradient)" opacity="0.8"/>
  <circle cx="160" cy="140" r="3" fill="#ffffff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="310" cy="190" r="2" fill="#ffffff" opacity="0.4"/>
</svg>
