<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* SVG custom styling adapting to host design system tokens */
    .svg-node {
      fill: var(--card);
      stroke: var(--border);
      stroke-width: 1.5px;
      transition: all 0.3s ease;
    }
    .svg-node.active {
      fill: var(--card);
      stroke: var(--primary);
      stroke-width: 2.5px;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.35));
    }
    .svg-node.dimmed {
      opacity: 0.35;
    }
    .svg-text {
      fill: var(--foreground);
      font-size: 13px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .svg-text-title {
      font-weight: 700;
      font-size: 14px;
    }
    .svg-text-muted {
      fill: var(--muted-foreground);
      font-size: 11px;
      font-family: ui-monospace, monospace;
    }
    .svg-line {
      stroke: var(--border);
      stroke-width: 1.75px;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .svg-line.active {
      stroke: var(--primary);
      stroke-width: 2.2px;
    }
    .svg-line-flow {
      stroke: var(--primary);
      stroke-dasharray: 6 6;
      animation: svg-flow 1s linear infinite;
    }
    @keyframes svg-flow {
      to {
        stroke-dashoffset: -12;
      }
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-3 sm:p-4 flex flex-col gap-3">
  <!-- Main Card Container -->
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-4 sm:p-5 shadow-sm flex flex-col gap-4">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-[var(--border)] pb-3">
      <div>
        <span class="text-xs font-mono font-semibold text-[var(--primary)] uppercase tracking-wider">Step <!-- {{STEP_NUMBER}} --></span>
        <h2 class="text-lg font-bold text-[var(--foreground)] tracking-tight"><!-- {{TITLE}} --></h2>
      </div>
      <div class="px-2.5 py-1 rounded-full text-xs font-medium bg-[var(--background)] text-[var(--muted-foreground)] border border-[var(--border)]">
        Live Explainer
      </div>
    </div>

    <!-- Timeline pills -->
    <div class="flex gap-2 overflow-x-auto pb-1" id="timeline">
      <!-- {{STEPS_TIMELINE}} -->
    </div>

    <!-- SVG Canvas Area -->
    <div class="bg-[var(--background)] border border-[var(--border)] rounded-lg p-4 flex items-center justify-center min-h-[280px] overflow-hidden">
      <!-- {{SVG_CONTENT}} -->
    </div>

    <!-- Current Step Focus Note -->
    <div class="bg-[var(--background)] border border-[var(--border)] rounded-lg p-3.5 flex flex-col gap-1">
      <div class="flex items-center gap-1.5 text-xs font-semibold text-[var(--primary)]">
        <span>💡 Step Focus</span>
      </div>
      <p class="text-sm text-[var(--muted-foreground)] leading-relaxed">
        <!-- {{NOTE_CONTENT}} -->
      </p>
    </div>
  </div>
</body>
</html>
