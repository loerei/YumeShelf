name: Test Suite (Cross-Platform)

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
      - chore/*
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Cache node-gyp Headers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\node-gyp\Cache
          key: ${{ runner.os }}-node-gyp-${{ steps.setup-node.outputs.node-version }}
          restore-keys: |
            ${{ runner.os }}-node-gyp-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Engine Package
        run: pnpm --filter @yumeshelf/engine build

      - name: Run Engine Unit Tests
        run: pnpm --filter @yumeshelf/engine run test:run

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Compile Main Process
        run: pnpm run compile:main

      - name: Run Main Process Unit Tests
        run: pnpm run test:unit

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Toolchain & Target Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native/playtime-helper -> native/playtime-helper/target"

      - name: Rust Playtime Helper Cargo Test
        run: cargo test --manifest-path native/playtime-helper/Cargo.toml
