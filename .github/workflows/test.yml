name: Test Suite (Cross-Platform)

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
      - chore/*
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node Modules (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Node Modules (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: npm install --ignore-scripts

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run TypeScript & Unit Tests
        run: npm test

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Toolchain & Target Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native/playtime-helper -> native/playtime-helper/target"

      - name: Rust Playtime Helper Cargo Test
        run: cargo test --manifest-path native/playtime-helper/Cargo.toml
