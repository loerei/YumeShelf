<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">YumeShelf wordmark with refined bookshelf icon</title>
  <desc id="desc">Horizontal YumeShelf wordmark using the refined bookshelf icon on a transparent background.</desc>

  <defs>
    <linearGradient id="lockupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22242c" />
      <stop offset="100%" stop-color="#0f1014" />
    </linearGradient>

    <linearGradient id="iconBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b36" />
      <stop offset="100%" stop-color="#101115" />
    </linearGradient>

    <linearGradient id="iconAccentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <linearGradient id="textAccentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>

    <linearGradient id="shelfLineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a4b56" stop-opacity="0.95" />
      <stop offset="66%" stop-color="#00c6ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffe259" stop-opacity="0.88" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softTextShadow" x="-5%" y="-15%" width="110%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>


  <g transform="translate(40 40) scale(0.46875)">
    <rect width="512" height="512" rx="100" fill="url(#iconBgGradient)"/>

    <path d="M 110 400 L 402 400" stroke="#4a4b56" stroke-width="12" stroke-linecap="round"/>

    <g transform="translate(0, -2)">
      <rect x="144" y="232" width="56" height="170" rx="8" fill="#1c1d24" stroke="#e2e2e2" stroke-width="12" stroke-linejoin="round"/>
      <line x1="156" y1="264" x2="188" y2="264" stroke="#e2e2e2" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g transform="translate(0, -2)">
      <rect x="216" y="184" width="64" height="218" rx="8" fill="#1c1d24" stroke="url(#iconAccentGradient)" stroke-width="14" stroke-linejoin="round"/>
      <circle cx="248" cy="232" r="8" fill="url(#iconAccentGradient)"/>
      <circle cx="248" cy="264" r="8" fill="url(#iconAccentGradient)"/>
    </g>

    <g transform="translate(364, 398) rotate(18) translate(-364, -398)">
      <rect x="308" y="242" width="56" height="156" rx="8" fill="#1c1d24" stroke="#e2e2e2" stroke-width="12" stroke-linejoin="round"/>
      <line x1="336" y1="274" x2="336" y2="306" stroke="#e2e2e2" stroke-width="6" stroke-linecap="round"/>
    </g>

    <path d="M 248 60 Q 248 116 304 116 Q 248 116 248 172 Q 248 116 192 116 Q 248 116 248 60 Z" fill="url(#goldGradient)" filter="url(#iconGlow)"/>
    <path d="M 344 130 Q 344 150 364 150 Q 344 150 344 170 Q 344 150 324 150 Q 344 150 344 130 Z" fill="url(#goldGradient)" opacity="0.8"/>
    <circle cx="160" cy="140" r="3" fill="#ffffff" opacity="0.6" filter="url(#iconGlow)"/>
    <circle cx="310" cy="190" r="2" fill="#ffffff" opacity="0.4"/>
  </g>

  <g filter="url(#softTextShadow)">
    <text x="330" y="162"
          font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif"
          font-size="100"
          font-weight="800"
          letter-spacing="-3.5">
      <tspan fill="#ffffff">Yume</tspan><tspan fill="url(#textAccentGradient)">Shelf</tspan>
    </text>

    <path d="M 336 196 L 858 196" stroke="url(#shelfLineGradient)" stroke-width="10" stroke-linecap="round"/>

    <text x="336" y="240"
          font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif"
          font-size="26"
          font-weight="700"
          letter-spacing="5"
          fill="#b7bac4">YOUR DREAMS, ORGANIZED</text>
  </g>
</svg>
